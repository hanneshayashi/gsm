version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - unused
    - govet
    - ineffassign
    - gocritic
    - misspell
    - bodyclose

linters-settings:
  gocritic:
    disabled-checks:
      - hugeParam  # Google API structs are large by nature

issues:
  exclude-dirs:
    - vendor
  max-issues-per-linter: 0
  max-same-issues: 0
