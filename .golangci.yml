version: "2"

linters:
  enable:
    - errcheck
    - staticcheck
    - unused
    - govet
    - ineffassign
    - gocritic
    - misspell
    - bodyclose

  settings:
    gocritic: {}  # hugeParam is disabled by default

  exclusions:
    rules:
      # Close() in deferred calls is universally safe to ignore —
      # errors are extremely rare and not actionable.
      - linters:
          - errcheck
        source: "defer .+\\.Close\\(\\)"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
